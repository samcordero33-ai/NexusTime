android.useAndroidX=true

# Memoria para el daemon de Gradle.
# GitHub Actions runners tienen poca memoria por defecto y el build moria
# con "Gradle build daemon has been stopped: since the JVM garbage collector
# is thrashing" durante :app:mergeExtDexDebug.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Reducir presion de memoria durante la compilacion.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=false
android.enableR8.fullMode=false
